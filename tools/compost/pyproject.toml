[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compost"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=1.9",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "rich>=13.0",
]

[project.scripts]
compost = "compost.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fastapi>=0.110"]
shims = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.setuptools]
package-dir = {"" = ".."}
packages = [
    "compost",
    "compost.cli",
    "compost.gitea",
    "compost.model",
    "compost.mcp",
    "compost.ingest",
    "compost.synth",
    "compost.codify",
    "compost.checks",
    "compost.shims",
    "compost.worker",
]

[tool.setuptools.package-data]
"compost.ingest" = ["classifier_rules.yaml"]
"compost.synth" = ["prompts/*.md"]
"compost.codify" = ["schema/*.kt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external processes (qmd binary, network)",
]
